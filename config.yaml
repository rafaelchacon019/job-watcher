# Configuracion de Fase 1 para job-watcher.
# Esta fase usa datos locales de prueba, sin conectarse a correos ni portales.

intervalo_revision_minutos: 60

# Worker local automatico.
# En Fase 3.1 queda apagado por defecto para evitar ejecuciones accidentales.
# Para modo continuo, usar run_once: false.
worker_settings:
  enabled: false
  interval_minutes: 1
  run_once: true

# Logs locales del worker.
logging_settings:
  enabled: true
  log_dir: logs
  worker_log: worker.log
  error_log: errors.log
  level: INFO

# Analisis IA opcional sobre ofertas ya priorizadas.
# En Fase 5.1 queda apagado y solo se prueba manualmente.
ai_settings:
  enabled: false
  provider: openai
  model: gpt-4.1-mini
  max_jobs_per_cycle: 3
  min_score: 20
  include_raw_description: false

# Checkpoint local para no reprocesar los mismos correos.
checkpoint_settings:
  enabled: true
  path: data/email_checkpoint.json
  max_processed_ids: 500

# Notificaciones locales por consola.
# En Fase 2.9.1 quedan apagadas y solo leen ofertas ya guardadas.
notification_settings:
  enabled: false
  min_score: 20
  strict_min_score: 25
  max_notifications: 5
  include_application_updates: false
  skip_generic_titles: true
  skip_non_target_areas: true
  channels:
    console: true
    telegram: false

# Preparacion para una fase futura de lectura IMAP.
# En Fase 2.1 queda apagado: no se leen correos reales todavia.
email_settings:
  enabled: false
  days_back: 1
  max_emails: 20
  folders:
    - INBOX
  subject_keywords:
    - empleo
    - trabajo
    - job alert
    - alerta de empleo
    - LinkedIn
    - Computrabajo
    - El Empleo
  sender_keywords:
    - linkedin
    - computrabajo
    - elempleo
    - empleo
    - jobs
  ignored_keywords:
    - publicidad
    - promoción
    - newsletter

# Fuentes ATS publicas permitidas.
# En Fase 4.1 queda apagado y solo se prueba manualmente.
ats_sources:
  enabled: false
  max_results: 10
  min_score: 20
  keywords:
    - software
    - engineer
    - developer
    - backend
    - frontend
    - full stack
    - data
    - junior
  exclude_keywords:
    - sales
    - marketing
    - legal
    - recruiter
    - talent acquisition
    - principal
    - staff
    - director
    - manager
    - security
    - ai research
    - machine learning
    - data scientist
    - counsel
    - legal counsel
    - solutions engineer
    - technical solutions
    - support engineer
    - customer engineer
    - customer success
    - account executive
    - product manager
    - product counsel
  preferred_locations:
    - remote
    - latam
    - colombia
    - bogotá
    - bogota
  # Agrega aqui slugs ATS solo despues de validarlos manualmente.
  # Ejemplos de formato:
  # greenhouse_companies:
  #   - stripe
  # lever_companies:
  #   - netflix
  #
  # Candidatas tech/remotas/LATAM para validar antes de agregarlas:
  # - GitLab
  # - Docker
  # - Supabase
  # - Vercel
  # - Netlify
  # - Deel
  # - Remote
  # - Auth0 / Okta
  # - Automattic
  # - Canonical
  greenhouse_companies: []
  lever_companies: []

portales_objetivo:
  - LinkedIn
  - Computrabajo
  - Elempleo
  - Indeed
  - Torre

ubicaciones_preferidas:
