# Configuracion de Fase 1 para job-watcher.
# Esta fase usa datos locales de prueba, sin conectarse a correos ni portales.

intervalo_revision_minutos: 60

portales_objetivo:
  - LinkedIn
  - Computrabajo
  - Elempleo
  - Indeed
  - Torre

ubicaciones_preferidas:
  - Bogotá
  - Colombia
  - Remoto

modalidades_preferidas:
  - Remoto
  - Híbrido

niveles_preferidos:
  - Junior
  - Entry Level
  - Trainee
  - Aprendiz
  - Practicante
  - Semi Senior

tecnologias_fuertes:
  - Angular
  - TypeScript
  - JavaScript
  - .NET
  - C#
  - ASP.NET Core
  - Node.js
  - SQL Server
  - PostgreSQL
  - Shopify
  - Liquid
  - API REST
  - JWT
  - Git

tecnologias_condicionales:
  nombres:
    - Python
    - PL/SQL
  niveles_compatibles:
    - Junior
    - Entry Level
    - Trainee
    - Aprendiz
    - Practicante
  niveles_no_prioritarios:
    - Semi Senior alto
    - Senior
    - Lead
    - Tech Lead
    - Architect
  experiencia_baja_max_anios: 3
  experiencia_no_prioritaria_mayor_a_anios: 3

palabras_negativas:
  - Senior
  - Lead
  - Tech Lead
  - Architect
  - Manager
  - 5 años
  - 6 años
  - presencial fuera de Bogotá

reglas_puntaje:
  tecnologia_fuerte: 12
  tecnologia_condicional_compatible: 12
  tecnologia_condicional_no_prioritaria: -18
  modalidad_preferida: 10
  ubicacion_preferida: 8
  nivel_preferido: 10
  palabra_negativa: -12
  puntaje_minimo: 0
  puntaje_maximo: 100
