  - Híbrido

niveles_preferidos:
  - Junior
  - Entry Level
  - Trainee
  - Aprendiz
  - Practicante
  - Semi Senior

tecnologias_fuertes:
  - Angular
  - TypeScript
  - JavaScript
  - .NET
  - C#
  - ASP.NET Core
  - Node.js
  - SQL Server
  - PostgreSQL
  - Shopify
  - Liquid
  - API REST
  - JWT
  - Git

tecnologias_condicionales:
  nombres:
    - Python
    - PL/SQL
  niveles_compatibles:
    - Junior
    - Entry Level
    - Trainee
    - Aprendiz
    - Practicante
  niveles_no_prioritarios:
